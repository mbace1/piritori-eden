<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="792" viewBox="0 0 1280 792" role="img" aria-labelledby="t d">
  <title id="t">Piritori to Eden transit layer visual specification</title>
  <desc id="d">Every element of the transit layer drawn at size on the board's own card: printed Era I lines against lit Era II lines, a live vehicle chip with its stale ghost, live and scheduled stop marks, the congestion band, and the wait panel.</desc>

  <defs>
    <pattern id="card" width="31" height="31" patternUnits="userSpaceOnUse">
      <rect width="31" height="31" fill="#171d20"/>
      <path d="M2 7h7M17 3h10M8 21h11M23 26h5" stroke="#273034" stroke-width="1" opacity=".55"/>
      <circle cx="6" cy="27" r="1" fill="#384145" opacity=".35"/>
      <circle cx="25" cy="14" r="1" fill="#0a0e10" opacity=".6"/>
    </pattern>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="s"/>
      <feOffset in="s" dy="4" result="o"/>
      <feFlood flood-color="#05080a" flood-opacity=".65"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- L4: congestion thickens and warms. No scale, no number. -->
    <linearGradient id="jam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#cc7a3e" stop-opacity="0"/>
      <stop offset=".45" stop-color="#cc7a3e" stop-opacity=".35"/>
      <stop offset=".78" stop-color="#c1783b" stop-opacity=".85"/>
      <stop offset="1"   stop-color="#b0552c" stop-opacity=".95"/>
    </linearGradient>
    <style>
      .h    { font: 600 15px ui-monospace, "SF Mono", Menlo, monospace; fill: #d6c5a5; letter-spacing: .12em; }
      .sub  { font: 400 12.5px ui-monospace, Menlo, monospace; fill: #8a7355; }
      .note { font: 400 12px ui-monospace, Menlo, monospace; fill: #7d6b52; }
      .chip { font: 700 13px ui-monospace, Menlo, monospace; fill: #171d20; }
      .num  { font: 700 26px ui-monospace, Menlo, monospace; fill: #d6c5a5; }
      .rule { stroke: #2c3439; stroke-width: 1; }
      /* printed: flat fill, hard keyline, no light */
      .printed { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      /* live: same path, thin bright core, bloom */
      .core    { fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1280" height="792" fill="url(#card)"/>
  <rect x="0" y="0" width="1280" height="62" fill="#111719" opacity=".55"/>
  <text x="34" y="32" class="h">TRANSIT LAYER — VISUAL SPECIFICATION</text>
  <text x="34" y="50" class="sub">ink on the paper · drawn in code · never generated art</text>
  <line x1="0" y1="62" x2="1280" y2="62" class="rule"/>

  <!-- ─────────────── 9.3  PRINTED vs LIVE ─────────────── -->
  <text x="34" y="100" class="h">9.3  ERA READS AT A GLANCE</text>

  <!-- Era I: printed -->
  <text x="34" y="128" class="sub">ERA I — printed</text>
  <text x="34" y="146" class="note">flat · hard keyline · 1px registration drift · no light</text>
  <g>
    <!-- registration drift: the keyline sits a pixel off the fill -->
    <path class="printed" d="M40 196 L150 196 L214 232 L340 232" stroke="#0d1113" stroke-width="15"/>
    <path class="printed" d="M39 195 L149 195 L213 231 L339 231" stroke="#cc7a3e" stroke-width="9"/>
    <path class="printed" d="M40 240 L170 240 L226 272 L340 272" stroke="#0d1113" stroke-width="12"/>
    <path class="printed" d="M39 239 L169 239 L225 271 L339 271" stroke="#778d5f" stroke-width="6.5"/>
    <!-- paper line chips, as the existing board already draws -->
    <g transform="translate(370 195)" filter="url(#lift)">
      <rect x="-19" y="-12" width="38" height="24" rx="2" fill="#cc7a3e" stroke="#111" stroke-width="3"/>
      <text x="-6" y="6" class="chip">M</text>
    </g>
    <g transform="translate(370 239)" filter="url(#lift)">
      <rect x="-19" y="-12" width="38" height="24" rx="2" fill="#778d5f" stroke="#111" stroke-width="3"/>
      <text x="-13" y="6" class="chip">3B</text>
    </g>
    <text x="34" y="308" class="note">metro printed in board umber — §9.2, clears the reserved</text>
    <text x="34" y="325" class="note">warning orange that HSL orange collides with</text>
  </g>

  <line x1="430" y1="110" x2="430" y2="340" class="rule"/>

  <!-- Era II: live -->
  <text x="462" y="128" class="sub">ERA II — live</text>
  <text x="462" y="146" class="note">same geometry · bright core · bloom · vehicles on it</text>
  <g>
    <path class="core" d="M468 196 L578 196 L642 232 L768 232" stroke="#7a3410" stroke-width="15"/>
    <path class="core" d="M468 196 L578 196 L642 232 L768 232" stroke="#FF6319" stroke-width="5" filter="url(#bloom)"/>
    <path class="core" d="M468 240 L598 240 L654 272 L768 272" stroke="#0d3a26" stroke-width="12"/>
    <path class="core" d="M468 240 L598 240 L654 272 L768 272" stroke="#00985F" stroke-width="4" filter="url(#bloom)"/>
    <g transform="translate(798 196)" filter="url(#lift)">
      <rect x="-19" y="-12" width="38" height="24" rx="2" fill="#FF6319" stroke="#111" stroke-width="3"/>
      <text x="-6" y="6" class="chip">M</text>
    </g>
    <g transform="translate(798 240)" filter="url(#lift)">
      <rect x="-19" y="-12" width="38" height="24" rx="2" fill="#00985F" stroke="#111" stroke-width="3"/>
      <text x="-6" y="6" class="chip">3</text>
    </g>
    <text x="462" y="308" class="note">the bloom is the only lit thing on a night board —</text>
    <text x="462" y="325" class="note">the eye finds the network as the layer comes on</text>
  </g>

  <line x1="860" y1="110" x2="860" y2="340" class="rule"/>

  <!-- ─────────────── 9.1 weight carries hierarchy ─────────────── -->
  <text x="892" y="128" class="sub">9.1 — WEIGHT BEFORE COLOUR</text>
  <text x="892" y="146" class="note">readable with no colour vision at all</text>
  <g stroke-linecap="round">
    <line x1="898" y1="180" x2="1080" y2="180" stroke="#0d1113" stroke-width="15"/>
    <line x1="898" y1="180" x2="1080" y2="180" stroke="#FF6319" stroke-width="9"/>
    <text x="1098" y="185" class="note">metro</text>
    <line x1="898" y1="214" x2="1080" y2="214" stroke="#0d1113" stroke-width="12"/>
    <line x1="898" y1="214" x2="1080" y2="214" stroke="#00985F" stroke-width="6.5"/>
    <text x="1098" y="219" class="note">tram</text>
    <line x1="898" y1="246" x2="1080" y2="246" stroke="#0d1113" stroke-width="9"/>
    <line x1="898" y1="246" x2="1080" y2="246" stroke="#8C4799" stroke-width="4.5"/>
    <text x="1098" y="251" class="note">train</text>
    <line x1="898" y1="274" x2="1080" y2="274" stroke="#0d1113" stroke-width="7"/>
    <line x1="898" y1="274" x2="1080" y2="274" stroke="#007AC9" stroke-width="3"/>
    <text x="1098" y="279" class="note">bus</text>
  </g>
  <text x="892" y="318" class="note">there are hundreds of buses — thinnest, or the</text>
  <text x="892" y="335" class="note">Era II board is nothing but buses</text>

  <line x1="0" y1="368" x2="1280" y2="368" class="rule"/>

  <!-- ─────────────── 9.4 the vehicle chip ─────────────── -->
  <text x="34" y="404" class="h">9.4  A LIVE VEHICLE</text>
  <text x="34" y="428" class="note">chip in the line colour · keyline · notch along hdg</text>

  <g>
    <path class="core" d="M40 500 L330 500" stroke="#0d3a26" stroke-width="12"/>
    <path class="core" d="M40 500 L330 500" stroke="#00985F" stroke-width="4" filter="url(#bloom)"/>

    <!-- reporting: filled, notched, carrying its desi -->
    <g transform="translate(120 500)">
      <path d="M-17 -10 H11 L20 0 L11 10 H-17 Z" fill="#00985F" stroke="#0b0e10" stroke-width="3" stroke-linejoin="round"/>
      <text x="-11" y="5" class="chip">3</text>
    </g>
    <text x="86" y="536" class="note">reporting</text>

    <!-- ghost: >15s with no message — hollow, colourless -->
    <g transform="translate(268 500)" opacity=".5">
      <path d="M-17 -10 H11 L20 0 L11 10 H-17 Z" fill="none" stroke="#8a7355" stroke-width="3" stroke-dasharray="4 3" stroke-linejoin="round"/>
    </g>
    <text x="228" y="536" class="note">ghost — no fix for 15s</text>
    <text x="34" y="576" class="note">interpolate BETWEEN fixes.</text>
    <text x="34" y="594" class="note">never extrapolate past the last one —</text>
    <text x="34" y="612" class="note">that is inventing a tram.</text>
    <text x="34" y="638" class="note">a vehicle that stopped reporting must</text>
    <text x="34" y="656" class="note">LOOK like one, and its arrival drops</text>
    <text x="34" y="674" class="note">to live:false in the same instant.</text>
  </g>

  <line x1="430" y1="386" x2="430" y2="736" class="rule"/>

  <!-- ─────────────── 9.5 stop marks ─────────────── -->
  <text x="462" y="404" class="h">9.5  ONE FILL, ALL THE TRUTH</text>
  <text x="462" y="428" class="note">same shape, same place — only the fill differs</text>

  <circle cx="500" cy="482" r="11" fill="#d6c5a5" stroke="#0b0e10" stroke-width="3"/>
  <text x="528" y="479" class="sub">LIVE</text>
  <text x="528" y="497" class="note">a vehicle is reporting; this is where it is</text>

  <circle cx="500" cy="540" r="11" fill="none" stroke="#8a7355" stroke-width="3"/>
  <text x="528" y="537" class="sub">TIMETABLE</text>
  <text x="528" y="555" class="note">this is when it is SUPPOSED to come</text>

  <text x="462" y="596" class="note">Era I is all hollow rings — there is no such</text>
  <text x="462" y="614" class="note">thing as a live 2003 tram, and the board</text>
  <text x="462" y="632" class="note">says so without apologising for it.</text>

  <!-- 9.6 congestion -->
  <text x="462" y="672" class="h">9.6  CONGESTION</text>
  <path d="M468 700 H800" stroke="#3a3128" stroke-width="6" stroke-linecap="round"/>
  <path d="M468 700 H800" stroke="url(#jam)" stroke-width="17" stroke-linecap="round"/>
  <text x="462" y="726" class="note">thickens and warms · never a number</text>

  <line x1="860" y1="386" x2="860" y2="736" class="rule"/>

  <!-- ─────────────── 9.7 the wait panel ─────────────── -->
  <text x="892" y="404" class="h">9.7  THE WAIT IS A PLACE</text>

  <g filter="url(#lift)">
    <rect x="892" y="424" width="356" height="272" rx="4" fill="#1b2225" stroke="#2c3439" stroke-width="2"/>
    <rect x="892" y="424" width="356" height="42" rx="4" fill="#111719"/>
    <text x="910" y="451" class="sub">HAKANIEMI · PLATFORM</text>

    <g transform="translate(928 508)">
      <rect x="-19" y="-12" width="38" height="24" rx="2" fill="#00985F" stroke="#111" stroke-width="3"/>
      <text x="-6" y="6" class="chip">3</text>
    </g>
    <text x="962" y="502" class="num">4</text>
    <text x="990" y="502" class="sub">MIN</text>
    <circle cx="1184" cy="496" r="9" fill="#d6c5a5" stroke="#0b0e10" stroke-width="3"/>
    <text x="1120" y="522" class="note">live</text>

    <text x="910" y="546" class="note">next after: 12 min · 20 min</text>

    <text x="910" y="590" class="sub">EXPOSURE</text>
    <rect x="910" y="602" width="320" height="12" rx="2" fill="#0d1113" stroke="#2c3439" stroke-width="1"/>
    <rect x="910" y="602" width="176" height="12" rx="2" fill="#cc7a3e"/>
    <text x="910" y="642" class="note">two men you have seen before are on this platform.</text>
    <text x="910" y="660" class="note">the 6 is slower and goes the long way round.</text>
    <text x="910" y="678" class="note">the exposure clock is running while you decide.</text>
  </g>

  <text x="892" y="722" class="note">the countdown ticks in REAL seconds in every</text>
  <text x="892" y="740" class="note">rate mode — one that lies is worse than none.</text>

  <line x1="0" y1="756" x2="1280" y2="756" class="rule"/>
  <text x="34" y="778" class="note">board palette: paper #d6c5a5 · water #0f2934 · umber #cc7a3e · card #171d20   ·   HSL data CC BY 4.0, attributed in the transit panel</text>
</svg>
