<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Piritori to Eden Era I Kallio map blueprint</title>
  <desc id="desc">A north-up, geographically grounded cut-card relief blueprint of Kallio in 2003 with eight active slice anchors, public routes, locked expansion areas, and fictional sites attached to public anchors.</desc>
  <defs>
    <pattern id="paperNoise" width="31" height="31" patternUnits="userSpaceOnUse">
      <rect width="31" height="31" fill="#171d20"/>
      <path d="M2 7h7M17 3h10M8 21h11M23 26h5" stroke="#273034" stroke-width="1" opacity=".55"/>
      <circle cx="6" cy="27" r="1" fill="#384145" opacity=".35"/>
      <circle cx="25" cy="14" r="1" fill="#0a0e10" opacity=".6"/>
    </pattern>
    <pattern id="waterNoise" width="52" height="34" patternUnits="userSpaceOnUse">
      <rect width="52" height="34" fill="#102530"/>
      <path d="M2 9q11-6 22 0t22 0M-8 25q11-6 22 0t22 0t22 0" fill="none" stroke="#19404e" stroke-width="2" opacity=".65"/>
    </pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offset"/>
      <feComponentTransfer in="offset" result="shadow"><feFuncA type="linear" slope=".75"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softLift" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offset"/>
      <feComponentTransfer in="offset" result="shadow"><feFuncA type="linear" slope=".6"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="worldClip"><rect x="22" y="92" width="1110" height="786" rx="4"/></clipPath>
    <style>
      .frame{fill:#0d1215;stroke:#927b5f;stroke-width:3}
      .paper{fill:#b79b70;stroke:#2b2620;stroke-width:2}
      .land{fill:url(#paperNoise);stroke:#9b7e59;stroke-width:7;stroke-linejoin:bevel}
      .block{fill:#252c2f;stroke:#111719;stroke-width:3;stroke-linejoin:bevel}
      .block2{fill:#20272a;stroke:#101416;stroke-width:3;stroke-linejoin:bevel}
      .road{fill:none;stroke:#555b5b;stroke-width:18;stroke-linecap:square;stroke-linejoin:bevel}
      .roadInner{fill:none;stroke:#2e3538;stroke-width:11;stroke-linecap:square;stroke-linejoin:bevel}
      .street{fill:none;stroke:#42494b;stroke-width:7;stroke-linecap:square}
      .rail{fill:none;stroke:#090c0e;stroke-width:18}
      .railTie{fill:none;stroke:#8a8272;stroke-width:3;stroke-dasharray:4 12}
      .tram{fill:none;stroke:#71885b;stroke-width:8;stroke-linecap:square;stroke-linejoin:bevel}
      .metro{fill:none;stroke:#c1783b;stroke-width:7;stroke-dasharray:13 9}
      .route{fill:none;stroke:#43b8c4;stroke-width:8;stroke-linecap:square;stroke-linejoin:bevel}
      .goods{fill:none;stroke:#bd568c;stroke-width:7;stroke-dasharray:11 10}
      .nodeOuter{fill:#111719;stroke:#b89a6d;stroke-width:7}
      .nodeInner{fill:#1d2528;stroke:#0a0d0f;stroke-width:3}
      .active{fill:#43b8c4}
      .service{fill:#bd568c}
      .warm{fill:#cc7a3e}
      .park{fill:#81965c}
      .locked{fill:#303638;stroke:#77736b;stroke-width:5}
      .teaser{fill:#22282b;stroke:#cc7a3e;stroke-width:5;stroke-dasharray:8 6}
      .landmark{fill:#b79b70;stroke:#191d1f;stroke-width:4}
      .labelTab{fill:#b79b70;stroke:#16191b;stroke-width:3}
      .darkTab{fill:#151b1e;stroke:#8a7355;stroke-width:3}
      .title{font-family:"Arial Narrow",Arial,sans-serif;font-size:39px;font-weight:900;letter-spacing:3px;fill:#e6d8bd}
      .sub{font-family:ui-monospace,monospace;font-size:15px;font-weight:700;letter-spacing:1.3px;fill:#83cbd2}
      .label{font-family:"Arial Narrow",Arial,sans-serif;font-size:19px;font-weight:900;letter-spacing:1.3px;fill:#16191b}
      .darkLabel{font-family:"Arial Narrow",Arial,sans-serif;font-size:18px;font-weight:900;letter-spacing:1.1px;fill:#e6d8bd}
      .small{font-family:ui-monospace,monospace;font-size:13px;fill:#c4b28f}
      .tiny{font-family:ui-monospace,monospace;font-size:11px;fill:#9ea3a0}
      .panelH{font-family:"Arial Narrow",Arial,sans-serif;font-size:24px;font-weight:900;letter-spacing:2px;fill:#e6d8bd}
      .panelT{font-family:ui-monospace,monospace;font-size:15px;fill:#cbb996}
      .panelTiny{font-family:ui-monospace,monospace;font-size:12px;fill:#8f9896}
      .flow{fill:#d6c5a5;stroke:#181b1c;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#090d0f"/>
  <rect x="18" y="16" width="1564" height="66" class="frame"/>
  <text id="title" x="42" y="58" class="title">PIRITORI → EDEN</text>
  <text x="455" y="46" class="sub">ERA I · KALLIO · 2003</text>
  <text x="455" y="67" class="tiny">PUBLIC GEOGRAPHY / FICTIONAL SITE ANCHORS / NORTH UP</text>
  <text x="1342" y="56" class="sub">MAP v1.0</text>

