name: Fix C18 interrupted preview
on:
  push:
    branches: [fix/c18-unified-ui-rendering]
    paths: ['.github/workflows/c18-recovery-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c18-unified-ui-rendering
      - name: Reset presentation-only preview with the interrupted action
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/fight-module/main.js');s=p.read_bytes()
          old=b"function resumeGraphics(){busy=false;action='';"
          assert s.count(old)==1
          p.write_bytes(s.replace(old,old+b'labUI?.cancel();',1))
          p=Path('web/test/c18-render-contract.mjs');s=p.read_bytes()
          old=b"const html=readFileSync"
          assert s.count(old)==1
          s=s.replace(old,b"assert.ok(main.includes(\"function resumeGraphics(){busy=false;action='';labUI?.cancel();\"),'recovery clears the interrupted preview with its action');\n"+old,1)
          p.write_bytes(s)
          p=Path('design/C18_UNIFIED_UI.md');p.write_bytes(p.read_bytes()+b'\nGraphics recovery also clears the interrupted, uncommitted forecast when resetting the selected action. Otherwise the short-landscape dock can retain a stale confirmation sheet over the reset commands. This resets presentation only; the existing recovery-state and exact-once shot assertions remain unchanged.\n')
          PY
          node --check web/fight-module/main.js
          node web/test/c18-render-contract.mjs
          node web/test/crew-run.mjs
          rm .github/workflows/c18-recovery-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/fight-module/main.js web/test/c18-render-contract.mjs design/C18_UNIFIED_UI.md .github/workflows/c18-recovery-fix.yml
          git commit -m 'C.18: clear interrupted confirmation when restoring graphics'
          git push origin HEAD:fix/c18-unified-ui-rendering
