name: C18 UI and renderer review
on:
  push:
    branches: [fix/c18-unified-ui-rendering]
  pull_request:
    paths: ['web/crew-run/**', 'web/fight-module/main.js', 'web/fight-module/tactical-ui.js', 'web/test/c18-*']
permissions:
  contents: read
jobs:
  ui-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node web/test/c18-render-contract.mjs && node web/test/crew-run.mjs
      - run: npm install --prefix /tmp/piritori-test playwright pngjs
      - run: /tmp/piritori-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Real browser UI and nonblank arena checks
        env:
          NODE_PATH: /tmp/piritori-test/node_modules
          CREW_RUN_URL: http://127.0.0.1:8781/web/crew-run/
          C18_OUTPUT: /tmp/c18-review
        run: |
          python3 -m http.server 8781 --bind 127.0.0.1 > /tmp/c18-server.log 2>&1 &
          node web/test/c18-ui-rendering.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c18-ui-rendering
          path: /tmp/c18-review
          retention-days: 3
