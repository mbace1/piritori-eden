name: Prepare C19 candidate
on:
  push:
    branches: [qa/post-c18-acceptance-workspace]
    paths: [.github/workflows/c19-candidate.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounded delta against fixed source and apply
        run: |
          cp .qa/c19-payload.b64 /tmp/c19-payload.b64
          git checkout -b c19-candidate-work 37e18e3af536e023fc6b557e73fa610867d85176
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          raw=zlib.decompress(base64.b64decode(pathlib.Path('/tmp/c19-payload.b64').read_text(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='74250b329b7e55591306757c991dba46339c618d8b9cbeb33df091b0760256d4'
          changes=json.loads(raw)
          for name,change in changes.items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
              assert name=='ACTIVE_CONTEXT.md' or name.startswith(('web/','design/','tools/publish/'))
              before=p.read_bytes() if p.is_file() else b''
              assert hashlib.sha256(before).hexdigest()==change['before'],name+' base differs'
              after=before
              for offset,length,text in reversed(change['ops']):
                  after=after[:offset]+text.encode()+after[offset+length:]
              assert hashlib.sha256(after).hexdigest()==change['after'],name+' result differs'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(after)
          pathlib.Path('/tmp/c19-paths').write_text('\n'.join(changes)+'\n')
          PY
      - name: Mission replay and publication contract checks
        run: |
          node web/test/crew-run.mjs
          node web/test/c18-render-contract.mjs
          node --check web/fight-module/main.js
          node --check web/crew-run/ui.js
          python3 -m unittest discover -s tools/publish -v
      - name: Commit and fast-forward the isolated candidate only
        run: |
          git config user.name 'Piritori acceptance worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/c19-paths
          git diff --cached --check
          git commit -m 'C.19: focused battlefield labels, extraction cues and outcome acceptance'
          git push origin HEAD:refs/heads/feat/c19-battlefield-clarity
          mkdir -p /tmp/c19-candidate
          git rev-parse HEAD > /tmp/c19-candidate/source-commit.txt
          git diff --stat HEAD^ HEAD > /tmp/c19-candidate/change-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c19-candidate-source
          path: /tmp/c19-candidate
          retention-days: 3
