# One-shot, review-only extraction for PR #108.
# Restricted to the Aatami concept branch; never promotes art to runtime.
name: Aatami review pose split
on:
  push:
    branches:
      - art/aatami-concept-brief
    paths:
      - .github/workflows/aatami-review-pose-split.yml

permissions:
  contents: write

jobs:
  split-review-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install 'Pillow>=10,<13'
      - name: Split approved source sheet into two individual review poses
        run: python tools/art/split_aatami_pose_sheet.py
      - name: Commit only corrected review images and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            art-src/concepts/people/aatami-young-pose-sheet-v01.png \
            art-src/concepts/people/aatami-young-pose-sheet-v01.txt \
            art-src/concepts/people/aatami-young-support-05.png \
            art-src/concepts/people/aatami-young-support-05.txt \
            art-src/concepts/people/aatami-young-support-07.png \
            art-src/concepts/people/aatami-young-support-07.txt
          if git diff --cached --quiet; then
            echo "Already generated; no new commit"
            exit 0
          fi
          git commit -m "art: split young Aatami pose sheet into individual review studies"
          git push origin HEAD:art/aatami-concept-brief
