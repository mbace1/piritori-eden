              s=once(s,'return {x:b.x-rect.x,y:b.y-rect.y,width:b.width,height:b.height};});','return {x:b.x-rect.x,y:b.y-rect.y,width:b.width,height:b.height};}).filter(b=>b.y+b.height>0&&b.y<h&&b.x+b.width>0&&b.x<w);')
