              s=once(s,"const touch=navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches;","const touch=navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches;\nconst safeGraphics=isCrew&&new URLSearchParams(location.search).get('graphics')==='safe';\nlet renderError='';\nconst frameSize=new T.Vector2();")
