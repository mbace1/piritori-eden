name: Apply M1 navigation orientation candidate
on:
  push:
    branches: [qa/m1-navigation-apply]
    paths: [.github/workflows/m1-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
