name: Apply M1 navigation runtime delta
on:
  push:
    branches: [qa/m1-navigation-apply]
    paths: [.github/workflows/m1-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded inspection/presence split
        run: |
          git fetch origin feat/m1-navigation-orientation
          git checkout -B m1-work origin/feat/m1-navigation-orientation
          python3 - <<'PY'
          from pathlib import Path
          changed=set()
          def replace(path,old,new):
              p=Path(path);text=p.read_text();count=text.count(old)
              assert count==1,(path,count,old[:100])
              p.write_text(text.replace(old,new));changed.add(path)
          app='web/js/v3/app.js'
          replace(app,"let observation = '';\nlet toastTimer;","let observation = '';\n// Presentation-only map cursor. Never persisted and never used for access, prices, visits or encounters.\nlet inspectionFocus = null;\nlet toastTimer;")
          replace(app,"function anchorSvg(anchor, current, selected) {\n  const point = anchor.board;\n  const locked = ['locked', 'teaser'].includes(anchor.sliceState);\n  const stateClass = [current ? 'current' : '', selected ? 'selected' : '', locked ? 'locked' : '', anchor.sliceState === 'landmark' ? 'landmark' : ''].join(' ');","function anchorSvg(anchor, current, inspected, present) {\n  const point = anchor.board;\n  const locked = ['locked', 'teaser'].includes(anchor.sliceState);\n  const stateClass = [current ? 'current' : '', inspected ? 'selected' : '', present ? 'present' : '', locked ? 'locked' : '', anchor.sliceState === 'landmark' ? 'landmark' : ''].join(' ');")
          replace(app,"      ${mission}\n      <circle class=\"map-node-dot\" cx=\"${point.x}\" cy=\"${point.y}\" r=\"${locked ? 14 : 18}\"/>","      ${mission}\n      ${present ? `<circle class=\"map-presence-ring\" cx=\"${point.x}\" cy=\"${point.y}\" r=\"30\"/>` : ''}\n      <circle class=\"map-node-dot\" cx=\"${point.x}\" cy=\"${point.y}\" r=\"${locked ? 14 : 18}\"/>")
          replace(app,"  const selected = data.anchors.get(state.selectedAnchor) ?? data.anchors.get(slot.anchor_id);\n  const draftPath = routeDraft.length === 2 ? shortestPath(data.map, routeDraft[0], routeDraft[1]) : routeDraft;","  const lead = data.anchors.get(slot.anchor_id);\n  const present = data.anchors.get(state.selectedAnchor) ?? lead;\n  const selected = data.anchors.get(inspectionFocus) ?? present;\n  const here = selected.id === state.selectedAnchor;\n  const lockedArea = ['locked', 'teaser'].includes(selected.sliceState);\n  const visitsHere = here ? availableVisits(state, data) : [];\n  const draftPath = routeDraft.length === 2 ? shortestPath(data.map, routeDraft[0], routeDraft[1]) : routeDraft;")
          replace(app,"<desc id=\"mapDesc\">Twelve accurate public anchors compressed into one relief map. The next encounter is at ${esc(data.anchors.get(slot.anchor_id)?.label)}.</desc>","<desc id=\"mapDesc\">Fifteen public anchors compressed into one relief map. Orange marks today's story lead, cyan is the area being inspected, and the ring marks Aatami's active area. The next encounter is at ${esc(lead?.label)}.</desc>")
          replace(app,"${data.map.anchors.map(anchor => anchorSvg(anchor, anchor.id === slot.anchor_id, anchor.id === selected.id)).join('')}","${data.map.anchors.map(anchor => anchorSvg(anchor, anchor.id === slot.anchor_id, anchor.id === selected.id, anchor.id === state.selectedAnchor)).join('')}")
          replace(app,"      <aside class=\"map-side\">\n        ${progressionCard(slot)}","      <aside class=\"map-side\">\n        <section class=\"paper-panel orientation-card\" aria-label=\"Map orientation\">\n          <p class=\"section-label\">TODAY'S LEAD</p>\n          <h2>${esc(lead?.label ?? slot.anchor_id)}</h2>\n          <p class=\"dim\">${esc(nextEncounter?.id.replace('enc-', '').replaceAll('-', ' ') ?? 'story lead')} · ${esc(formatBlock(state, data.content))}</p>\n          <div class=\"orientation-tags\">\n            <span class=\"tag present-tag\">YOU ARE HERE · ${esc(present.label)}</span>\n            <span class=\"tag active\">INSPECTING · ${esc(selected.label)}</span>\n          </div>\n          <button class=\"paper-button cyan\" data-action=\"show-lead\" ${selected.id === lead?.id ? 'disabled' : ''}>SHOW LEAD</button>\n        </section>\n        ${progressionCard(slot)}")
          old="""          <p class=\"section-label\">${esc(selected.sliceState)} · PUBLIC ANCHOR</p>
          <h2>${esc(selected.label)}</h2>
          <p>${esc(anchorDescription(selected))}</p>
          <div class=\"route-steps\">${(selected.roles ?? []).map(role => `<span class=\"tag\">${esc(cap(role))}</span>`).join('')}</div>
          <div class=\"node-actions\">
            ${availableVisits(state, data).map(v => `<button class=\"paper-button\" data-action=\"open-visit\" data-visit=\"${esc(v.id)}\">VISIT · ${esc(v.participants.includes('jaska') ? 'Jaska' : 'Slomo')}</button>`).join('')}
            ${selected.id === slot.anchor_id ? `<button class=\"paper-button primary\" data-action=\"open-encounter\">${tr('enter')} · ${esc(nextEncounter?.id.replace('enc-', '').replaceAll('-', ' '))}</button>` : ''}
            ${selected.sliceState === 'training'
              ? `<button class=\"paper-button primary\" data-action=\"start-training\">${tr('start_training')}</button>`
              : `<button class=\"paper-button\" data-action=\"plan-route\">${routePlanning ? tr('clear') : tr('planning')}</button>`}
          </div>
          ${routePlanning ? renderRoutePlanner(draftPath) : ''}"""
          new="""          <p class=\"section-label\">INSPECTING · ${esc(selected.sliceState)} · PUBLIC ANCHOR</p>
          <h2>${esc(selected.label)}</h2>
          <p>${esc(anchorDescription(selected))}</p>
          <div class=\"route-steps\">${(selected.roles ?? []).map(role => `<span class=\"tag\">${esc(cap(role))}</span>`).join('')}</div>
          <div class=\"node-actions\">
            ${visitsHere.map(v => `<button class=\"paper-button\" data-action=\"open-visit\" data-visit=\"${esc(v.id)}\">VISIT · ${esc(v.participants.includes('jaska') ? 'Jaska' : 'Slomo')}</button>`).join('')}
            ${here && selected.id === slot.anchor_id ? `<button class=\"paper-button primary\" data-action=\"open-encounter\">${tr('enter')} · ${esc(nextEncounter?.id.replace('enc-', '').replaceAll('-', ' '))}</button>` : ''}
            ${!here && !lockedArea ? `<button class=\"paper-button primary\" data-action=\"use-area\" data-anchor=\"${esc(selected.id)}\">USE AREA · ${esc(selected.label)}</button>` : ''}
            ${here && selected.sliceState === 'training' ? `<button class=\"paper-button primary\" data-action=\"start-training\">${tr('start_training')}</button>` : ''}
            ${selected.sliceState !== 'training' ? `<button class=\"paper-button\" data-action=\"plan-route\">${routePlanning ? tr('clear') : tr('planning')}</button>` : ''}
          </div>
          <p class=\"dim location-rule\">${lockedArea ? 'Visible, but sealed in this slice.' : here ? 'Area access is active here. Looking elsewhere does not move Aatami.' : 'Inspection is free. USE AREA deliberately changes the active area; this orientation slice does not spend travel time.'}</p>
          ${routePlanning ? renderRoutePlanner(draftPath) : ''}"""
          replace(app,old,new)
          old="""  } else if (action === 'select-anchor') {
    const id = target.dataset.anchor;
    state.selectedAnchor = id;
    // Standing somewhere is how you learn its price (board.js). Without this
    // line the board is permanently blank and looks broken rather than unearned.
    markSeen(state, id);
    if (routePlanning) {
      const anchor = data.anchors.get(id);
      if (['locked', 'teaser'].includes(anchor?.sliceState)) {
        logToast(`${anchor.label} is visible but sealed in this slice.`);
      } else if (routeDraft.length >= 2) routeDraft = [id];
      else if (!routeDraft.includes(id)) routeDraft.push(id);
    }
    persist(); render();
  } else if (action === 'open-encounter') openEncounter();"""
          new="""  } else if (action === 'select-anchor') {
    const id = target.dataset.anchor;
    // M1: inspection is a UI cursor only. It cannot grant access, refresh a quote,
    // open a visit or silently move Aatami. Those still key off selectedAnchor.
    inspectionFocus = id;
    if (routePlanning) {
      const anchor = data.anchors.get(id);
      if (['locked', 'teaser'].includes(anchor?.sliceState)) {
        logToast(`${anchor.label} is visible but sealed in this slice.`);
      } else if (routeDraft.length >= 2) routeDraft = [id];
      else if (!routeDraft.includes(id)) routeDraft.push(id);
    }
    render();
  } else if (action === 'show-lead') {
    inspectionFocus = currentSchedule(state, data.content)?.anchor_id ?? state.selectedAnchor;
    render();
  } else if (action === 'use-area') {
    const id = target.dataset.anchor;
    const anchor = data.anchors.get(id);
    if (!anchor || ['locked', 'teaser'].includes(anchor.sliceState)) {
      logToast(`${anchor?.label ?? id} is visible but sealed in this slice.`);
      return;
    }
    state.selectedAnchor = id;
    inspectionFocus = id;
    // This is the deliberate equivalent of the old click-to-stand behavior.
    // M2 replaces this no-time-cost activation with preview/cancel/commit travel.
    markSeen(state, id);
    persist(); render();
  } else if (action === 'open-encounter') openEncounter();"""
          replace(app,old,new)
          replace(app,"  if (!battle.training) advanceSchedule(state, data);\n  state.mode = 'route';","  if (!battle.training) { advanceSchedule(state, data); inspectionFocus = null; }\n  state.mode = 'route';")
          replace(app,"  } else if (action === 'advance') {\n    advanceSchedule(state, data); persist(); render();","  } else if (action === 'advance') {\n    advanceSchedule(state, data); inspectionFocus = null; persist(); render();")
          replace(app,"  routeDraft = [];\n  observation = '';\n  persist();","  routeDraft = [];\n  observation = '';\n  inspectionFocus = null;\n  persist();")
          replace(app,"    function jumpTo(target) {\n      if (!target) return;","    function jumpTo(target) {\n      if (!target) return;\n      inspectionFocus = null;")
          replace(app,"      version: 'v4.48',","      version: 'v4.49',")
          css='web/v3.css'
          replace(css,".map-node.selected .map-node-dot { fill: var(--cyan); stroke: #c8fbff; }\n.map-node.locked", ".map-node.selected .map-node-dot { fill: var(--cyan); stroke: #c8fbff; }\n.map-presence-ring { fill: none; stroke: var(--green); stroke-width: 5; stroke-dasharray: 11 7; pointer-events: none; }\n.map-node.present .map-node-label { paint-order: stroke fill; }\n.map-node.locked")
          replace(css,".progression-card { border-color: #a8753e; background: linear-gradient(135deg, rgba(202,111,52,.15), transparent 52%), #1a242c; }", ".orientation-card { border-color: #527a6b; background: linear-gradient(135deg, rgba(98,183,151,.12), transparent 55%), #172129; }\n.orientation-card .paper-button { margin-top: 10px; width: 100%; }\n.orientation-tags { display: grid; gap: 6px; margin-top: 10px; }\n.orientation-tags .tag { justify-content: flex-start; white-space: normal; }\n.present-tag { color: #d9f5e7; border-color: #527a6b; }\n.location-rule { padding-top: 8px; border-top: 1px dashed #4c473f; }\n.progression-card { border-color: #a8753e; background: linear-gradient(135deg, rgba(202,111,52,.15), transparent 52%), #1a242c; }")
          index='web/index.html'
          replace(index,'v3.css?v=5','v3.css?v=6')
          replace(index,'<small>ACT I · v4.48</small>','<small>ACT I · v4.49</small>')
          replace(index,'js/v3/app.js?v=13','js/v3/app.js?v=14')
          Path('/tmp/m1-runtime-paths').write_text('\n'.join(sorted(changed))+'\n')
          PY
          node --check web/js/v3/app.js
          node web/test/v3-state.mjs
          node web/test/visits.mjs
          node web/test/v3-contract.mjs
          git config user.name 'Piritori navigation worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/m1-runtime-paths
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'M1: separate map inspection from active area and story lead'
          git push origin HEAD:refs/heads/feat/m1-navigation-orientation
