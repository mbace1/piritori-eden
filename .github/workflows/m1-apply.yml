          replace(app,"  const selected = data.anchors.get(state.selectedAnchor) ?? data.anchors.get(slot.anchor_id);\n  const draftPath = routeDraft.length === 2 ? shortestPath(data.map, routeDraft[0], routeDraft[1]) : routeDraft;","  const lead = data.anchors.get(slot.anchor_id);\n  const present = data.anchors.get(state.selectedAnchor) ?? lead;\n  const selected = data.anchors.get(inspectionFocus) ?? present;\n  const here = selected.id === state.selectedAnchor;\n  const lockedArea = ['locked', 'teaser'].includes(selected.sliceState);\n  const visitsHere = here ? availableVisits(state, data) : [];\n  const draftPath = routeDraft.length === 2 ? shortestPath(data.map, routeDraft[0], routeDraft[1]) : routeDraft;")
