          Path('design/M1_NAVIGATION_ORIENTATION.md').write_text('''# M1 — navigation orientation\n\nM1 answers one question from the M0 audit: can the player inspect the city without the inspection itself becoming a journey?\n\n## Player contract\n\n- **Today’s lead** is the authored scheduled encounter and stays orange.\n- **You are here** is the existing `state.selectedAnchor` access/market position and gets a separate green ring.\n- **Inspecting** is a presentation-only cursor. It is cyan, is not saved, and never calls `markSeen`.\n- **Show lead** returns the inspection cursor to the authored lead without moving Aatami.\n- **Use area** is the explicit compatibility action for the old location/access behavior. It changes `selectedAnchor` and market observation on purpose. It spends no travel time; M2 replaces it with preview/cancel/commit travel after D002 time semantics are kept explicit.\n\nLocked/teaser anchors can be inspected but cannot be activated. Existing encounters, visits, shops/fences and route planning remain keyed to the active area, not the inspection cursor. No geography, prices, mission rewards, combat resolver or save schema changes.\n\n## Acceptance\n\nBrowser acceptance covers active, locked and landmark inspection with byte-equivalent campaign state; Show lead; deliberate area activation; first purchase and first sale (€160→€115→€183, stock 0→1→0); reload; and a Jaska return visit reached through the actual map/Use area controls. Both portrait and landscape are exercised.\n\nNext: M2 makes the Paper Bag Piritori→Siltasaari movement a real preview/cancel/commit journey while retaining one settlement owner and not inventing a second schedule-time cost.\n''')
          changed.add('design/M1_NAVIGATION_ORIENTATION.md')

          Path('web/test/m1-navigation.cjs').write_text(r'''const {chromium}=require('playwright');
const http=require('http'),fs=require('fs'),path=require('path'),assert=require('node:assert/strict');
const ROOT=path.resolve(__dirname,'..','..');
const MIME={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.mjs':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json; charset=utf-8','.svg':'image/svg+xml','.webp':'image/webp','.png':'image/png'};
const server=http.createServer((req,res)=>{const requestPath=decodeURIComponent(req.url.split('?')[0]);let file=path.resolve(ROOT,`.${requestPath}`);if(!file.startsWith(`${ROOT}${path.sep}`)&&file!==ROOT){res.writeHead(403);res.end('forbidden');return;}if(fs.existsSync(file)&&fs.statSync(file).isDirectory())file=path.join(file,'index.html');if(!fs.existsSync(file)){res.writeHead(404);res.end('missing');return;}res.writeHead(200,{'Content-Type':MIME[path.extname(file)]||'application/octet-stream'});fs.createReadStream(file).pipe(res);});
const OUT=process.env.M1_OUTPUT||'/tmp/m1-navigation';fs.mkdirSync(OUT,{recursive:true});
const snap=p=>p.evaluate(()=>JSON.stringify(window.__ptv3.state));
(async()=>{await new Promise(r=>server.listen(0,'127.0.0.1',r));const base=`http://127.0.0.1:${server.address().port}`;const browser=await chromium.launch();const results=[];
try{for(const spec of [{name:'phone',width:412,height:915},{name:'landscape',width:915,height:412}]){const ctx=await browser.newContext({viewport:{width:spec.width,height:spec.height},hasTouch:true,isMobile:true});const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));let shell404=0;p.on('response',r=>{if(r.status()===404&&new URL(r.url()).pathname.endsWith('/hub/shell.js'))shell404++;});p.on('console',m=>{if(m.type()==='error'&&!/Failed to load resource/.test(m.text()))errors.push(m.text());});
try{await p.goto(`${base}/web/`);await p.waitForFunction(()=>window.__ptv3?.data);await p.locator('#beginButton').click();await p.waitForSelector('.city-map');assert.equal(await p.locator('.time-card small').textContent(),'ACT I · v4.49');
const initial=await snap(p);assert.equal(await p.locator('[data-anchor-group="piritori"].current.selected.present').count(),1);
for(const id of ['hakaniemi','alppiharju','kallio_church']){const hit=p.locator(`[data-anchor-group="${id}"] .map-anchor-hit`);await hit.focus();await hit.press('Enter');assert.equal(await snap(p),initial,`inspection of ${id} must not change campaign state`);assert.equal(await p.locator(`[data-anchor-group="${id}"].selected`).count(),1);assert.equal(await p.evaluate(x=>window.__ptv3.state.seen?.[x]??null,id),null,`inspection of ${id} must not create market knowledge`);}
assert.match(await p.locator('.orientation-card').innerText(),/YOU ARE HERE · Piritori/i);assert.match(await p.locator('.orientation-card').innerText(),/INSPECTING · Kallio Church/i);await p.locator('[data-action="show-lead"]').click();assert.equal(await snap(p),initial);assert.equal(await p.locator('[data-anchor-group="piritori"].selected').count(),1);
await p.locator('[data-anchor-group="hakaniemi"] .map-anchor-hit').click();assert.equal(await snap(p),initial);await p.locator('[data-action="use-area"]').click();assert.equal(await p.evaluate(()=>window.__ptv3.state.selectedAnchor),'hakaniemi');assert.equal(await p.evaluate(()=>window.__ptv3.state.seen.hakaniemi),0);await p.locator('[data-action="show-lead"]').click();assert.equal(await p.evaluate(()=>window.__ptv3.state.selectedAnchor),'hakaniemi','Show lead cannot teleport');assert.equal(await p.locator('[data-action="open-encounter"]').count(),0,'lead encounter unavailable while operating elsewhere');await p.locator('[data-action="use-area"]').click();assert.equal(await p.evaluate(()=>window.__ptv3.state.selectedAnchor),'piritori');assert.ok(await p.locator('[data-action="open-encounter"]').isVisible());
await p.locator('[data-action="open-encounter"]').click();await p.locator('[data-choice="buy"]').click();assert.deepEqual(await p.evaluate(()=>[window.__ptv3.state.cash,window.__ptv3.state.stock.piri]),[115,1]);await p.locator('[data-action="advance"]').click();assert.equal(await p.locator('[data-anchor-group="siltasaari"].current.selected.present').count(),1,'new lead resets inspection to the new active area');await p.reload();await p.waitForFunction(()=>window.__ptv3?.data);await p.locator('#resumeButton').click();assert.equal(await p.locator('[data-anchor-group="siltasaari"].current.selected.present').count(),1,'reload restores presence but not a stale inspection cursor');await p.locator('[data-action="open-encounter"]').click();await p.locator('[data-choice="complete"]').click();assert.deepEqual(await p.evaluate(()=>[window.__ptv3.state.cash,window.__ptv3.state.stock.piri]),[183,0]);
// Set up an authored Jaska return; setup is direct, but all navigation/entry under test is visible UI.
await p.evaluate(()=>{const s=structuredClone(window.__ptv3.state);s.mode='route';s.scheduleIndex=3;s.selectedAnchor='piritori';s.choices['enc-jaska-receipt']='acknowledge';s.battle=null;window.__ptv3.debug.setState(s);});await p.waitForSelector('.city-map');const beforeVisit=await snap(p);await p.locator('[data-anchor-group="makelansilta"] .map-anchor-hit').click();assert.equal(await snap(p),beforeVisit,'inspecting Jaska area remains free');assert.equal(await p.locator('[data-action="open-visit"]').count(),0,'visit cannot open from inspection');await p.locator('[data-action="use-area"]').click();const visit=p.locator('[data-action="open-visit"]');assert.ok(await visit.isVisible(),'Jaska return appears only after deliberate area activation');await visit.click();assert.equal(await p.locator('#game').getAttribute('data-mode'),'visit');await p.screenshot({path:`${OUT}/${spec.name}-jaska-visit.png`,fullPage:true});assert.deepEqual(errors,[]);results.push({view:spec.name,inspectionStateFree:true,showLeadFree:true,explicitPresence:true,paperBag:[160,115,183],jaskaVisit:true,shell404});}finally{await ctx.close();}}
fs.writeFileSync(`${OUT}/results.json`,JSON.stringify(results,null,2));console.log('M1 navigation orientation passed',results);}finally{await browser.close();server.close();}})().catch(e=>{console.error(e);server.close();process.exit(1)});
''')
