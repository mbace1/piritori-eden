name: Integrate C18 source patch
on:
  push:
    branches: [fix/c18-unified-ui-rendering]
    paths: ['.github/workflows/c18-integrate.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c18-unified-ui-rendering
      - name: Integrate and validate source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source=Path('.github/workflows/c18-apply-readable.yml').read_text()
          body=source.split('        run: |\n',1)[1]
          script='\n'.join(line[10:] if line.startswith(' '*10) else line for line in body.splitlines())+'\n'
          Path('.github/workflows/c18-integrate.yml').unlink()
          subprocess.run(['bash','-e','-o','pipefail'],input=script,text=True,check=True)
          PY
