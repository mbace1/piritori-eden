name: C18 runtime and reference review
on:
  push:
    branches: [fix/c18-unified-ui-rendering]
    paths: ['.github/workflows/c18-review-bundle.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export tracked source for offline browser verification
        run: git archive --format=tar HEAD | gzip > /tmp/piritori-review.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: piritori-c18-review
          path: /tmp/piritori-review.tar.gz
          retention-days: 2
