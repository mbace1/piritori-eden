name: Aatami + Jaska paired cut-in candidate evidence
on:
  push:
    branches: [review/aatami-jaska-ensemble-20261108]
    paths:
      - 'art-src/cutins/ensemble-review.html'
      - 'art-src/cutins/ensemble-qc.cjs'
      - '.github/workflows/aatami-jaska-ensemble.yml'
  pull_request:
    paths:
      - 'art-src/cutins/ensemble-review.html'
      - 'art-src/cutins/ensemble-qc.cjs'
      - '.github/workflows/aatami-jaska-ensemble.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for review captures only
        run: |
          npm install --prefix /tmp/aatami-review-tools --no-save playwright
          /tmp/aatami-review-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture Aatami/Jaska review-only two-person scenes
        env:
          NODE_PATH: /tmp/aatami-review-tools/node_modules
        run: node art-src/cutins/ensemble-qc.cjs /tmp/aatami-jaska-evidence
      - name: Verify exactly 28 viewport screenshots at the tested commit
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/aatami-jaska-evidence/source-commit.txt
          node <<'NODE'
          const fs=require('node:fs');
          const base='/tmp/aatami-jaska-evidence/';
          const m=JSON.parse(fs.readFileSync(base+'ensemble-manifest.json','utf8'));
          const variants=['aatami','aatami-side'], viewports=['phone','desktop'];
          const moments=['idle','blink','aatami-talk','jaska-talk','aatami-nod','jaska-shake','reduced-motion-rest'];
          const required=new Set(variants.flatMap(v=>viewports.flatMap(p=>moments.map(t=>v+'-'+p+'-'+t+'.png'))));
          if(m.shots.length!==28)throw Error('Expected 28 screenshots, got '+m.shots.length);
          for(const s of m.shots) {
            if(!required.delete(s.file))throw Error('Unexpected or duplicate screenshot '+s.file);
            const png=fs.readFileSync(base+s.file);
            if(png.toString('hex',0,8)!=='89504e470d0a1a0a')throw Error('Bad PNG '+s.file);
            if(png.readUInt32BE(16)!==s.viewportSize.width || png.readUInt32BE(20)!==s.viewportSize.height)
              throw Error('Wrong dimensions '+s.file);
          }
          if(required.size)throw Error('Missing screenshots: '+[...required].join(', '));
          if(m.motion.length!==2||m.motion.some(x=>x.frameCount!==70||x.fps!==10))
            throw Error('Expected two 70-frame actual-motion renders');
          console.log('28 screenshot dimensions and two motion sequences verified');
          NODE
      - name: Encode 10 fps actual motion GIFs
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          for who in aatami aatami-side; do
            ffmpeg -hide_banner -nostdin -loglevel error -y -framerate 10 \
              -i "/tmp/aatami-jaska-evidence/motion-frames/$who/frame-%04d.png" \
              -filter_complex "[0:v]split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=3" \
              -loop 0 "/tmp/aatami-jaska-evidence/$who-jaska-ensemble.gif"
          done
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const root='/tmp/aatami-jaska-evidence/';
          for(const who of ['aatami','aatami-side']){
            const gif=fs.readFileSync(root+who+'-jaska-ensemble.gif');
            if(gif.length<8000 || !['GIF89a','GIF87a'].includes(gif.toString('ascii',0,6)))
              throw Error('Bad GIF for '+who);
            const first=fs.readFileSync(root+'motion-frames/'+who+'/frame-0000.png');
            const middle=fs.readFileSync(root+'motion-frames/'+who+'/frame-0030.png');
            const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
            if(hash(first)===hash(middle))throw Error('No actual motion for '+who);
            console.log(who+' candidate GIF exists and source frames differ; '+gif.length+' bytes');
          }
          NODE
          rm -rf /tmp/aatami-jaska-evidence/motion-frames
      - name: Upload candidate evidence, not an approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aatami-jaska-ensemble-candidate
          path: /tmp/aatami-jaska-evidence/
          if-no-files-found: warn
          retention-days: 7
