name: Apply C19 drawer correction
on:
  push:
    branches: [qa/post-c18-acceptance-workspace]
    paths: [.github/workflows/c19-drawer-fix.yml]
permissions:
  contents: write
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded byte delta
        run: |
          git checkout -b c19-drawer-work 595d380d8e495120f4cb8b4926860900d3a97aca
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,zlib
          payload=''
          raw=zlib.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='7e8ef76e17157602ac409fd39d4a81abffeb76e506f9443078ab4e24c5bd533e'
          changes=json.loads(raw)
          for name,c in changes.items():
              p=pathlib.Path(name);assert name.startswith('web/') and '..' not in p.parts
              b=p.read_bytes();assert hashlib.sha256(b).hexdigest()==c['before'],name
              for offset,length,text in reversed(c['ops']):b=b[:offset]+text.encode()+b[offset+length:]
              assert hashlib.sha256(b).hexdigest()==c['after'],name
              p.write_bytes(b)
          pathlib.Path('/tmp/c19-fix-paths').write_text('\n'.join(changes)+'\n')
          PY
          node web/test/crew-run.mjs
          node web/test/c18-render-contract.mjs
          git config user.name 'Piritori acceptance worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/c19-fix-paths
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'C19: close crew drawer before selection and target commands'
          git push origin HEAD:refs/heads/feat/c19-battlefield-clarity
