name: Apply C19 drawer correction
on:
  push:
    branches: [qa/post-c18-acceptance-workspace]
    paths: [.github/workflows/c19-drawer-fix.yml]
permissions:
  contents: write
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded drawer and cache correction
        run: |
          git checkout -b c19-drawer-work 595d380d8e495120f4cb8b4926860900d3a97aca
          python3 - <<'PY'
          from pathlib import Path
          paths=set()
          def edit(name,old,new):
              p=Path(name);b=p.read_bytes();assert b.count(old.encode())==1,name
              p.write_bytes(b.replace(old.encode(),new.encode()));paths.add(name)
          edit('web/fight-module/main.js','function select(id){',"function closeCrewPicker(){\n  if(!isCrew)return;const roster=$('roster'),picker=$('crew-picker'),hadFocus=roster.contains(document.activeElement);\n  roster.hidden=true;picker.setAttribute('aria-expanded','false');if(hadFocus)picker.focus({preventScroll:true});\n}\nfunction select(id){")
          edit('web/fight-module/main.js',"session.command('select',id);crew?.persist();action='';", "session.command('select',id);crew?.persist();closeCrewPicker();action='';")
          edit('web/fight-module/main.js',"session.battle.status!=='active')return;labUI?.cancel();if(['brace'", "session.battle.status!=='active')return;closeCrewPicker();labUI?.cancel();if(['brace'")
          for name in ['web/crew-run/startup.js','web/arena-lab/index.html','web/fight-module/index.html','web/bear-path/index.html']:
              edit(name,'main.js?v=29','main.js?v=30')
          edit('web/crew-run/index.html','startup.js?v=3','startup.js?v=4')
          edit('web/test/c18-render-contract.mjs','startup.js?v=3','startup.js?v=4')
          edit('web/test/c19-readability-browser.cjs',"await tap(p.locator('#crew-picker'));await tap(p.locator('[data-unitid=\"crew-1\"]'));await tap(p.locator('#crew-picker'));", "await tap(p.locator('#crew-picker'));await tap(p.locator('[data-unitid=\"crew-1\"]'));assert.equal(await p.locator('#roster').isVisible(),false,'selection clears the target area');assert.equal(await p.locator('#crew-picker').getAttribute('aria-expanded'),'false');")
          edit('web/test/crew-gamepad.cjs',"await navigate('#crew-picker');await press(0);assert.equal(await p.locator('#roster').isVisible(),false);", "assert.equal(await p.locator('#roster').isVisible(),false,'controller selection closes the drawer');assert.equal(await p.locator('#crew-picker').getAttribute('aria-expanded'),'false');")
          Path('/tmp/c19-fix-paths').write_text('\n'.join(sorted(paths))+'\n')
          PY
          node web/test/crew-run.mjs
          node web/test/c18-render-contract.mjs
          git config user.name 'Piritori acceptance worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/c19-fix-paths
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'C19: close crew drawer before selection and target commands'
          git push origin HEAD:refs/heads/feat/c19-battlefield-clarity
