name: Stage verified C18 patch
on:
  push:
    branches: [fix/c18-unified-ui-rendering]
    paths: ['.github/workflows/c18-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c18-unified-ui-rendering
          fetch-depth: 1
      - name: Apply exact reviewed source delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib,json,hashlib
          payload='''_PAYLOAD_PENDING'''
          # Fail closed: the staging delta must be complete before any source write.
          changes=json.loads(zlib.decompress(base64.b64decode(payload)))
          for change in changes:
              p=Path(change['path']); old=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==change['sha'],str(p)
              if change.get('delete'): p.unlink(); continue
              if 'new' in change: text=change['new']
              else:
                  text=old.decode('utf-8')
                  for i,j,value in reversed(change['ops']): text=text[:i]+value+text[j:]
              data=text.encode('utf-8')
              if 'result' in change: assert hashlib.sha256(data).hexdigest()==change['result'],str(p)
              p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
          PY
          node --check web/crew-run/ui.js
          node --check web/fight-module/main.js
          node web/test/c18-render-contract.mjs
          node web/test/crew-run.mjs
          rm .github/workflows/c18-stage.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'C.18: unify the tactical UI and render directly to the scene canvas'
          git push origin HEAD:fix/c18-unified-ui-rendering
