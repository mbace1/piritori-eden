<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Fine mid snow</title>
  <desc id="desc">Small drifting paper-flake circles for the mid weather pass.</desc>
  <defs>
    <pattern id="snow_pattern" width="220" height="190" patternUnits="userSpaceOnUse">
      <g fill="#ebe7db" fill-opacity=".48">
        <circle cx="28" cy="32" r="2.4"/><circle cx="112" cy="76" r="3.2"/><circle cx="188" cy="24" r="1.8"/>
        <circle cx="70" cy="154" r="2"/><circle cx="170" cy="142" r="2.8"/>
      </g>
    </pattern>
  </defs>
  <rect id="snow_mid" width="1920" height="1080" fill="url(#snow_pattern)"/>
</svg>
